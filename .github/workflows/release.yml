# Every push to main (other than docs-only, or with [skip release] in a commit message) bumps the version, builds the forwarder image, scans it,
# pushes ghcr.io/<owner>/codelikehome-forwarder:<version>, signs it and creates the GitHub release. Pushing a v* tag by hand still works too.
name: release
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  # Computes the next semver tag from the commits in this push: patch by
  # default, `#minor` / `#major` anywhere in a commit message bumps higher,
  # `[skip release]` skips the release. Empty output = nothing to release.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0; fi
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          if git tag --points-at HEAD | grep -q '^v'; then echo "HEAD is already released"; exit 0; fi
          if [ -n "$BEFORE" ] && ! [ "$BEFORE" = 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            msgs=$(git log --format=%B "$BEFORE..HEAD")
          else
            msgs=$(git log -1 --format=%B)
          fi
          if grep -qiF '[skip release]' <<<"$msgs"; then echo "[skip release] found"; exit 0; fi
          if [ -z "$latest" ]; then echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"; exit 0; fi
          IFS=. read -r maj min pat <<<"${latest#v}"
          if grep -qi '#major' <<<"$msgs"; then maj=$((maj+1)); min=0; pat=0
          elif grep -qi '#minor' <<<"$msgs"; then min=$((min+1)); pat=0
          else pat=$((pat+1))
          fi
          echo "tag=v$maj.$min.$pat" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: ${{ needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      packages: write
      id-token: write        # keyless signing with cosign
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/codelikehome-forwarder
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      # Scan BEFORE pushing; a fixable HIGH/CRITICAL stops the release.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with: {context: forwarder, load: true, tags: "scan-me:latest"}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with: {image-ref: "scan-me:latest", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1"}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: forwarder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: GitHub release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          # Curated CHANGELOG notes when the release matches VERSION, generated notes otherwise.
          if [ "$TAG" = "v$(cat VERSION)" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md)
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
