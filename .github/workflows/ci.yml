name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13"}
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: Shell scripts parse
        run: for f in host/install.sh host/verify.sh; do sh -n "$f"; done
      - name: Compose file renders
        run: CLH_TAG=0.0.0 CLH_UID=1000 CLH_SOCKET_DIR=/tmp/x docker compose -f compose/codelikehome.yaml config -q
